<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مصروفاتي – الشخصية والمنزلية</title>
<meta name="theme-color" content="#16273B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#16273b;--mute:#64748b;--line:#dde4ec;--brand:#0f766e;--brand2:#115e59;--warn:#c98a1b;--bad:#b42318;--soft:#e6f2f0;--shadow:0 1px 2px rgba(22,39,59,.06),0 4px 14px rgba(22,39,59,.05)}
:root[data-theme=dark]{--bg:#0e1a28;--card:#16273b;--ink:#e8eef5;--mute:#94a3b8;--line:#263a52;--brand:#2dd4bf;--brand2:#5eead4;--warn:#e0a93b;--bad:#f87171;--soft:#123a3c;--shadow:none}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;line-height:1.6}
header{background:var(--ink);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
:root[data-theme=dark] header{background:#0a131e;border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar h1{font-size:18px;margin:0;flex:1;min-width:140px}
.bar input,.bar button{font:inherit}
.bar input[type=month]{width:auto;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:5px 8px;color-scheme:dark}
.hd{flex-basis:100%;display:flex;flex-direction:column;line-height:1.45}
.hd b{font-size:14px;font-weight:600}
.hd small{font-size:11px;opacity:.75}
.ib{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.ib:hover{background:rgba(255,255,255,.22)}
main{max-width:1100px;margin:auto;padding:16px;display:grid;gap:14px}
main>*{min-width:0}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dt{margin:0 0 8px;font-size:15px;color:var(--ink)}
.cards>.card{padding:10px 8px;border-radius:10px}
.cards h2{font-size:11.5px;margin-bottom:6px;line-height:1.35}
.cards .big{font-size:clamp(13px,3.9vw,24px);line-height:1.3;letter-spacing:0;overflow-wrap:anywhere}
.cards .sub{font-size:10.5px;line-height:1.4}
.cards .prog{height:7px;margin:6px 0 3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.card h2{font-size:14px;margin:0 0 8px;color:var(--mute);font-weight:600}
.big{font-size:26px;font-weight:700;letter-spacing:-.3px}
.sub{font-size:12.5px;color:var(--mute)}
.prog{height:9px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--brand);border-radius:9px;transition:width .4s}
form{display:grid;gap:10px;max-width:520px}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:3px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input[type=checkbox]{width:22px;height:22px;padding:0;accent-color:var(--brand);cursor:pointer;flex:none}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{flex:1;margin:0;text-align:center;padding:8px;cursor:pointer;color:var(--ink);font-size:14px}
.seg input{display:none}
.seg input:checked+span{display:block;margin:-8px;padding:8px;background:var(--brand);color:#fff}
:root[data-theme=dark] .seg input:checked+span{color:#0e1a28}
.pdrow{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--ink);font-size:14px;margin:0}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
:root[data-theme=dark] .btn{color:#0e1a28}
.btn:hover{background:var(--brand2)}
.btn.ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tools>*{flex:1;min-width:120px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;color:var(--mute);font-weight:600;font-size:12.5px;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n{white-space:normal;color:var(--mute);min-width:90px}
td.a{font-weight:700;font-variant-numeric:tabular-nums}
tr.pend td:not(:first-child):not(:last-child){opacity:.55}
.tag{font-size:12px;padding:2px 9px;border-radius:20px;background:var(--soft);color:var(--brand2)}
:root[data-theme=dark] .tag{color:var(--brand)}
.tag.h{background:#fbf0d9;color:#8a5a00}
:root[data-theme=dark] .tag.h{background:#3a2f12;color:var(--warn)}
.del{background:none;border:0;color:var(--mute);cursor:pointer;font-size:16px}
.del:hover{color:var(--bad)}.del.ed:hover{color:var(--brand)}
.empty{text-align:center;color:var(--mute);padding:26px 8px}
.over{background:var(--bad)!important}.near{background:var(--warn)!important}
.neg{color:var(--bad)}
body{padding-bottom:72px}
.page{display:none;gap:14px}.page.on{display:grid}
.page>*{min-width:0}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{background:none;border:0;border-top:3px solid transparent;font:inherit;font-size:14px;font-weight:600;color:var(--mute);padding:12px 8px;cursor:pointer}
.nav button.on{color:var(--brand);border-top-color:var(--brand)}
.ar{display:grid;grid-template-columns:minmax(80px,1.2fr) 2fr auto;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.ar .nm small{display:block;font-size:11.5px;color:var(--mute)}
.ar .t{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.ar .t i{display:block;height:100%;background:var(--brand);border-radius:6px}
.ar.u .t i{background:var(--warn);opacity:.7}
.ar b{font-variant-numeric:tabular-nums;white-space:nowrap}
.tot{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 12px;padding-bottom:12px;border-bottom:2px solid var(--line);font-size:11.5px;line-height:1.35;color:var(--mute)}
.tot b{display:block;font-size:clamp(13px,3.9vw,17px);color:var(--ink);margin-top:2px;overflow-wrap:anywhere}
.tot small{display:block;font-size:10px;opacity:.8}
dialog{max-height:90vh;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:18px;max-width:340px;width:90%}
dialog::backdrop{background:rgba(0,0,0,.45)}
</style>
</head>
<body>
<header><div class="bar">
<h1>💼 مصروفاتي</h1>
<button class="ib" id="setBtn">⚙ الإعدادات</button>
<button class="ib" id="themeBtn">🌙</button>
<div class="hd"><b id="tdy"></b><small id="dinfo"></small></div>
</div></header>

<main>
<div class="page on" id="p1">
<div>
<h3 class="dt">📊 الميزانية</h3>
<section class="cards">
<div class="card"><h2>فلوسك</h2><div class="big" id="bud0">—</div></div>
<div class="card"><h2>مصاريفك</h2><div class="big" id="allx">0</div></div>
<div class="card"><h2>وفرت</h2><div class="big" id="saved">—</div></div>
</section>
</div>
<div>
<h3 class="dt">🧾 المصاريف</h3>
<section class="cards">
<div class="card"><h2>صرفت</h2><div class="big" id="spent">0</div><div class="prog"><i id="pb" style="width:0"></i></div></div>
<div class="card"><h2>باقي</h2><div class="big" id="left">0</div></div>
<div class="card"><h2>باقي لكل يوم</h2><div class="big" id="perday">—</div></div>
</section>
</div>

<section class="card">
<h2>تحليل المصروفات من الأكبر للأصغر <span class="sub">— المصروف وغير المصروف</span></h2>
<div id="an"></div>
</section>
</div>

<div class="page" id="p2">
<section class="card">
<h2>إضافة مصروف</h2>
<form id="f">
<div><label for="amt">المبلغ</label><input id="amt" type="number" step="0.01" min="0.01" required inputmode="decimal"></div>
<div><label for="note">اسم المصروف</label><input id="note" maxlength="80" required autocomplete="off" placeholder="مثال: قسط موبايل، إيجار، كهرباء…"></div>
<label class="pdrow"><input type="checkbox" id="pd" checked> تم صرفه (يُخصم من الميزانية)</label>
<div style="display:flex;gap:8px"><button class="btn" id="sv" type="submit" style="flex:1">حفظ المصروف</button><button class="btn ghost" id="cx" type="button" hidden>إلغاء التعديل</button></div>
</form>
</section>

<section class="card">
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px"><h2 style="margin:0">سجل المصروفات <span class="sub">— علّم ✓ لما يتصرف عشان يتخصم</span></h2><button class="btn ghost" id="cpBtn" type="button">📋 نسخ من شهر آخر</button></div>
<div class="tools">
<input id="q" placeholder="بحث بالاسم…">
<select id="fs"><option value="">الكل</option><option value="p">اتصرف</option><option value="u">لسه ما اتصرفش</option></select>
</div>
<div class="tbl"><table><thead><tr><th>✓</th><th>التاريخ</th><th>المبلغ</th><th>المصروف</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</section>
</div>
</main>

<nav class="nav" aria-label="التنقل">
<button id="n1" class="on" type="button">📊 الداشبورد</button>
<button id="n2" type="button">➕ المصروفات</button>
</nav>

<dialog id="cpd">
<h2 style="margin-top:0;font-size:17px">نسخ مصروفات من شهر</h2>
<label for="src">انسخ مصروفات شهر</label><select id="src"></select>
<div class="sub" style="margin:10px 0">إلى الشهر المفتوح الآن: <b id="dst"></b></div>
<label class="pdrow"><input type="checkbox" id="cpu" checked> علّمها "لسه ما اتصرفش" (وعلّم ✓ كل واحد لما يتصرف)</label>
<div style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="cpOk" style="flex:1">نسخ</button><button class="btn ghost" id="cpNo">إلغاء</button></div>
</dialog>

<dialog id="dlg">
<h2 style="margin-top:0;font-size:17px">الإعدادات</h2>
<label for="month">الشهر المعروض</label><input type="month" id="month"><div class="sub" id="mrange" style="margin:3px 0 10px"></div>
<label for="sday">يوم بداية الشهر</label><input id="sday" type="number" min="1" max="31" style="margin-bottom:10px">
<label for="bud">الميزانية الشهرية</label><input id="bud" type="number" min="0" step="1">
<div style="display:grid;gap:8px;margin-top:14px">
<button class="btn ghost" id="csv">تصدير CSV (Excel)</button>
<button class="btn ghost" id="bak">نسخة احتياطية JSON</button>
<button class="btn ghost" id="imp">استرجاع نسخة احتياطية</button>
<button class="btn ghost" id="clr" style="color:var(--bad)">مسح كل البيانات</button>
<button class="btn" id="ok">حفظ وإغلاق</button></div>
<input type="file" id="file" accept=".json" hidden>
</dialog>

<script>
const KEY="expense_tracker_v1";
let S={items:[],budget:0,startDay:29,cur:"ج.م",theme:"light"};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const migrate=()=>{S.items=(S.items||[]).map(i=>{
  const n=[i.cat,i.note].filter(x=>x&&String(x).trim()).join(" – ");
  return{id:i.id,amt:i.amt,date:i.date,note:n,paid:i.paid!==false}})};
migrate();
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const fmt=n=>new Intl.NumberFormat("ar-EG-u-nu-latn",{maximumFractionDigits:2}).format(n);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isPaid=i=>i.paid!==false;
const sum=a=>a.reduce((t,i)=>t+i.amt,0);

function theme(){document.documentElement.dataset.theme=S.theme;$("themeBtn").textContent=S.theme==="dark"?"☀️":"🌙"}
$("themeBtn").onclick=()=>{S.theme=S.theme==="dark"?"light":"dark";save();theme()};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dIn=(y,mo)=>new Date(y,mo,0).getDate();
const sdOf=(y,mo)=>Math.min(S.startDay||1,dIn(y,mo));
const parse=t=>{const[a,b,c]=t.split("-").map(Number);return new Date(a,b-1,c)};
const dayDiff=(a,b)=>Math.round((b-a)/864e5);
function period(key){
  const[y,mo]=key.split("-").map(Number);
  if(!S.startDay||S.startDay<=1)return{s:new Date(y,mo-1,1),e:new Date(y,mo-1,dIn(y,mo))};
  const py=mo===1?y-1:y,pm=mo===1?12:mo-1;
  return{s:new Date(py,pm-1,sdOf(py,pm)),e:new Date(y,mo-1,sdOf(y,mo)-1)};
}
function keyOf(t){
  const[y,mo,d]=t.split("-").map(Number),two=n=>String(n).padStart(2,"0");
  if(!S.startDay||S.startDay<=1||d<sdOf(y,mo))return y+"-"+two(mo);
  return (mo===12?y+1:y)+"-"+two(mo===12?1:mo+1);
}
const dd=d=>d.toLocaleDateString("ar-EG-u-nu-latn",{day:"numeric",month:"long"});
const rangeTxt=k=>{const P=period(k);return "من "+dd(P.s)+" إلى "+dd(P.e)};
function hdr(){
  const t0=parse(today()),k=keyOf(today()),P=period(k),m=$("month").value;
  $("tdy").textContent=t0.toLocaleDateString("ar-EG-u-nu-latn",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  let t="إجمالي أيام الشهر: "+(dayDiff(P.s,P.e)+1)+" · باقي "+dayDiff(t0,P.e)+" يوم غير النهاردة";
  if(m!==k)t+=" · المعروض: "+rangeTxt(m);
  $("dinfo").textContent=t;$("mrange").textContent=rangeTxt(m);
}
$("month").value=keyOf(today());

function render(){
  hdr();
  const m=$("month").value;
  const mi=S.items.filter(i=>keyOf(i.date)===m);
  const sp=mi.filter(isPaid),pend=mi.filter(i=>!isPaid(i));
  const spent=sum(sp),planned=sum(pend),B=S.budget,all=spent+planned;
  const ranked=[...mi].sort((a,b)=>b.amt-a.amt);
  // dashboard 1: budget
  $("bud0").textContent=B>0?fmt(B):"—";
  $("allx").textContent=fmt(all);
  const sv=$("saved");sv.className="big"+(B>0&&B-all<0?" neg":"");
  sv.textContent=B>0?(B-all<0?"عجز "+fmt(all-B):fmt(B-all)):"—";
  // dashboard 2: expenses (based on total expenses)
  $("spent").textContent=fmt(spent);
  const r=all?spent/all:0;$("pb").style.width=r*100+"%";
  $("left").textContent=fmt(planned);
  const P=period(m),t0=parse(today());
  let days;
  if(t0>=P.s&&t0<=P.e)days=dayDiff(t0,P.e)+1;
  else days=t0<P.s?dayDiff(P.s,P.e)+1:0;
  const pd=$("perday");
  pd.textContent=planned<=0?fmt(0):(days<=0?"—":fmt(planned/days));
  $("an").innerHTML=ranked.length?ranked.map(i=>`<div class="ar ${isPaid(i)?"":"u"}"><div class="nm">${esc(i.note)}<small>${isPaid(i)?"اتصرف":"لسه ما اتصرفش"} · ${Math.round(i.amt/all*100)}%</small></div><div class="t"><i style="width:${i.amt/ranked[0].amt*100}%"></i></div><b>${fmt(i.amt)}</b></div>`).join(""):'<div class="empty">لا توجد مصروفات لهذا الشهر</div>';
  const q=$("q").value.trim(),fs=$("fs").value;
  const list=mi.filter(i=>(!fs||(fs==="p")===isPaid(i))&&(!q||i.note.includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  $("rows").innerHTML=list.length?list.map(i=>`<tr class="${isPaid(i)?"":"pend"}"><td><input type="checkbox" class="chk" data-id="${i.id}" ${isPaid(i)?"checked":""} aria-label="تم الصرف"></td><td>${i.date}</td><td class="a">${fmt(i.amt)}</td><td class="n">${esc(i.note)}</td><td><button class="del ed" data-id="${i.id}" title="تعديل" aria-label="تعديل">✎</button> <button class="del" data-id="${i.id}" title="حذف" aria-label="حذف">✕</button></td></tr>`).join(""):'<tr><td colspan="5" class="empty">لا توجد مصروفات مطابقة. أضف أول مصروف من النموذج.</td></tr>';
}

let editId=null;
function endEdit(){
  editId=null;$("amt").value="";$("note").value="";$("pd").checked=true;
  $("sv").textContent="حفظ المصروف";$("cx").hidden=true;
}
$("cx").onclick=endEdit;
function go(n){
  $("p1").classList.toggle("on",n===1);$("p2").classList.toggle("on",n===2);
  $("n1").classList.toggle("on",n===1);$("n2").classList.toggle("on",n===2);
  window.scrollTo(0,0);
}
$("n1").onclick=()=>go(1);$("n2").onclick=()=>go(2);
$("f").onsubmit=e=>{
  e.preventDefault();
  const amt=parseFloat($("amt").value);if(!(amt>0))return;
  const note=$("note").value.trim(),paid=$("pd").checked;if(!note)return;
  const it=editId&&S.items.find(i=>i.id===editId);
  if(it){Object.assign(it,{amt,note,paid});$("month").value=keyOf(it.date)}
  else{S.items.push({id:Date.now(),amt,date:today(),note,paid});$("month").value=keyOf(today())}
  save();endEdit();render();$("amt").focus();
};
$("rows").onchange=e=>{
  const c=e.target.closest(".chk");if(!c)return;
  const it=S.items.find(i=>i.id==c.dataset.id);if(it){it.paid=c.checked;save();render()}
};
$("rows").onclick=e=>{
  const b=e.target.closest(".del");if(!b)return;
  if(b.classList.contains("ed")){
    const it=S.items.find(i=>i.id==b.dataset.id);if(!it)return;
    editId=it.id;$("amt").value=it.amt;$("note").value=it.note;$("pd").checked=isPaid(it);
    $("sv").textContent="حفظ التعديل";$("cx").hidden=false;
    $("f").scrollIntoView({behavior:"smooth",block:"center"});$("amt").focus();return;
  }
  if(confirm("حذف هذا المصروف؟")){if(editId==b.dataset.id)endEdit();S.items=S.items.filter(i=>i.id!=b.dataset.id);save();render()}
};
["month","q","fs"].forEach(id=>$(id).oninput=render);

const mName=m=>{const[y,mo]=m.split("-").map(Number);return new Date(y,mo-1,1).toLocaleDateString("ar-EG-u-nu-latn",{month:"long",year:"numeric"})+" ("+rangeTxt(m)+")"};
$("cpBtn").onclick=()=>{
  const cur=$("month").value,cnt={};
  S.items.forEach(i=>{const k=keyOf(i.date);if(k!==cur)cnt[k]=(cnt[k]||0)+1});
  const ks=Object.keys(cnt).sort().reverse();
  if(!ks.length){alert("لا توجد مصروفات في شهور أخرى لنسخها.");return}
  $("src").innerHTML=ks.map(k=>`<option value="${k}">${mName(k)} (${cnt[k]} مصروف)</option>`).join("");
  $("dst").textContent=mName(cur);$("cpd").showModal();
};
$("cpNo").onclick=()=>$("cpd").close();
$("cpOk").onclick=()=>{
  const src=$("src").value,cur=$("month").value,Ps=period(src),Pc=period(cur),len=dayDiff(Pc.s,Pc.e);
  S.items.filter(i=>keyOf(i.date)===src).forEach((i,n)=>{
    const off=Math.min(Math.max(dayDiff(Ps.s,parse(i.date)),0),len);
    const d=new Date(Pc.s.getFullYear(),Pc.s.getMonth(),Pc.s.getDate()+off);
    S.items.push({id:Date.now()+n,amt:i.amt,note:i.note,date:ymd(d),paid:$("cpu").checked?false:isPaid(i)});
  });
  save();$("cpd").close();render();
};
$("setBtn").onclick=()=>{$("bud").value=S.budget||"";$("sday").value=S.startDay;$("dlg").showModal()};
$("ok").onclick=()=>{
  S.budget=parseFloat($("bud").value)||0;
  const sd0=Math.min(31,Math.max(1,parseInt($("sday").value)||29));
  if(sd0!==S.startDay){S.startDay=sd0;$("month").value=keyOf(today())}
  save();$("dlg").close();render()};
function dl(name,text,type){if(window.AndroidApp&&AndroidApp.saveFile){AndroidApp.saveFile(name,text,type);return}const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
$("csv").onclick=()=>{
  const rows=[["التاريخ","الحالة","المبلغ","المصروف"],...[...S.items].sort((a,b)=>a.date.localeCompare(b.date)).map(i=>[i.date,isPaid(i)?"اتصرف":"لسه",i.amt,i.note])];
  dl("expenses.csv","\ufeff"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n"),"text/csv");
};
$("bak").onclick=()=>dl("expenses-backup-"+today()+".json",JSON.stringify(S),"application/json");
$("imp").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{
    try{const d=JSON.parse(r.result);if(!Array.isArray(d.items))throw 0;
      if(confirm("سيتم استبدال البيانات الحالية. متابعة؟")){S=Object.assign(S,d);migrate();save();theme();render();$("dlg").close()}}
    catch(x){alert("الملف غير صالح. اختر ملف نسخة احتياطية بصيغة JSON.")}
  };r.readAsText(f);e.target.value="";
};
$("clr").onclick=()=>{if(confirm("سيتم حذف كل المصروفات نهائياً. متابعة؟")){S.items=[];save();render();$("dlg").close()}};

theme();render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){try{navigator.serviceWorker.register("sw.js")}catch(e){}}
</script>
</body>
</html>
